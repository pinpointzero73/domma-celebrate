# Build and test domma-celebrate on every push and pull request.
#
# publish.yml already runs this same sequence, but only once a tag exists - by
# which point a broken build is a broken release. This runs it on the way in
# instead, so the tag is a formality rather than the first real check.
#
# The order is build-then-test on purpose, matching publish.yml: dist/ is
# gitignored, so a fresh checkout has none, and a spec that loads the built
# bundle would fail for want of a build rather than for anything wrong with
# the code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor declared in engines; 26 is the next one along, so a
        # deprecation lands here rather than in a consumer's install.
        node-version: ['24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bundles the package ships
        run: npm run build

      # The same shape check publish.yml makes. Shipping the ESM entry without
      # its theme chunks would 404 every celebration on the day it matters,
      # which is exactly the failure a smoke test cannot see.
      - name: Check the bundles are actually there
        run: |
          for f in dist/domma-celebrate.esm.js dist/domma-celebrate.cjs dist/domma-celebrate.min.js; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          test -d dist/chunks || { echo "::error::dist/chunks missing - the ESM build would 404 in season"; exit 1; }
          node scripts/verify-dist.mjs

      - name: Run tests
        run: npm run test:run

      # One copy is enough to inspect a failure; the matrix would otherwise
      # race two uploads to the same artifact name.
      - name: Upload the built bundles
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v7
        with:
          name: domma-celebrate-dist
          path: dist/
          retention-days: 7
