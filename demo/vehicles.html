<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas vehicles — local redraw preview</title>
<style>
body{margin:0;background:#101520;color:#f5e8d5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(24px,4vw,40px);margin-bottom:12px}p{color:#c0c9d3;line-height:1.6}canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(#152338,#0b1322);border:1px solid #394656;margin:20px 0}button{background:#e2bb77;color:#17202c;border:0;padding:12px 20px;border-radius:8px;font:inherit;cursor:pointer;margin-right:12px}a{color:#e2bb77}
</style>
<main><h1>A little more Christmas magic.</h1><p>The redrawn sleigh and vintage steam train, shown larger for review. Both use the same canvas drawings as the Christmas effect.</p><button id="pause">Pause</button><button id="direction">Reverse direction</button><h2>Santa's sleigh</h2><canvas id="sleigh" aria-label="Animated Santa sleigh with five reindeer"></canvas><h2>Christmas express</h2><canvas id="train" aria-label="Animated green steam locomotive and illuminated carriages"></canvas><p><a href="/santa">Back to Santa Jamie</a></p></main>
<script type="module">
import {drawSleigh,drawTrain} from '../src/themes/christmas-vehicles.js';
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,direction=1,time=0,last=0;
const pause=document.getElementById('pause');pause.textContent=paused?'Play':'Pause';pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Play':'Pause'};
document.getElementById('direction').onclick=()=>direction*=-1;
const canvases=[document.getElementById('sleigh'),document.getElementById('train')];
function frame(now){const delta=Math.min(50,now-(last||now));last=now;if(!paused)time+=delta;
for(const [i,c] of canvases.entries()){const w=c.clientWidth,h=i?280:260,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.height=h+'px'}const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
const fit=Math.min(1,w/1000);ctx.save();ctx.scale(fit,fit);const width=w/fit;
if(i===0){drawSleigh(ctx,{x:direction>0?140:width-140,baseY:165,startX:0,targetX:width,arcHeight:0,size:65,time,vx:direction,opacity:1})}
else{const x=direction>0?width-190:190;const smoke=Array.from({length:7},(_,j)=>{const age=(time/1000+j*.24)%1.8;return{x:x+direction*31.5*2.88-age*20*direction,y:235-44*2.88-age*32,size:9+age*14,opacity:Math.max(0,.65-age*.32)}});drawTrain(ctx,{x,y:235,size:32,time,vx:direction,carriages:3,smoke,opacity:1})}ctx.restore()}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</html>
