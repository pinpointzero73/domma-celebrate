<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonfire Night — illustration preview</title><style>body{margin:0;background:#101520;color:#eee5d7;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(30px,5vw,48px)}p{color:#bac7cd;line-height:1.7}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}canvas{display:block;width:100%;height:320px;border-radius:16px;background:radial-gradient(ellipse at 50% 30%,#233448,#0c1725);border:1px solid #405262;box-sizing:border-box}button{border:0;border-radius:8px;padding:12px 18px;background:#d3ac79;color:#172530;font:inherit;margin-right:12px;cursor:pointer}a{color:#dfba88}@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr}}@media(max-width:550px){.gallery{grid-template-columns:1fr}}</style><main><h1>Bonfire Night, with a warmer glow.</h1><p>Layered flames and charred logs, a dressed Guy, a Catherine wheel, a vintage Roman candle and fine wire sparklers. The next wave of seasonal illustrations.</p><button id="compare" aria-pressed="false">Show original</button><button id="pause">Pause animation</button><p id="version" aria-live="polite">New illustrations</p><div class="gallery"></div><p><a href="/public/celebrations-preview.html">Halloween and butterflies</a> · <a href="/showcase/celebrations">Back to the studio</a></p></main><script type="module">
import bonfire from '../src/themes/guy-fawkes.js';
const original=document.body.dataset.original?(await import(document.body.dataset.original)).default:null;
let old=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0;
const compare=document.getElementById('compare'),pause=document.getElementById('pause');
compare.disabled=!original;compare.onclick=()=>{old=!old;compare.textContent=old?'Show redraw':'Show original';compare.setAttribute('aria-pressed',String(old));document.getElementById('version').textContent=old?'Original artwork':'New illustrations'};
pause.textContent=paused?'Play animation':'Pause animation';pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Play animation':'Pause animation'};
const labels={Bonfire:'The bonfire',GuyEffigy:'A dressed Guy',CatherineWheel:'The Catherine wheel',RomanCandle:'A vintage Roman candle',SparklerBundle:'Wire sparklers'};
for(const [type,label] of Object.entries(labels)){const section=document.createElement('section');section.innerHTML=`<h2>${label}</h2><canvas data-type="${type}" aria-label="${label}"></canvas>`;document.querySelector('.gallery').append(section)}
function frame(now){const delta=Math.min(50,now-(last||now));last=now;if(!paused)time+=delta;
for(const c of document.querySelectorAll('canvas')){const w=c.clientWidth,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)||c.height!==320*dpr){c.width=Math.round(w*dpr);c.height=320*dpr}const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,320);
const type=c.dataset.type,p={x:w/2,y:type==='Bonfire'?250:140,size:type==='Bonfire'?82:64,opacity:1,burnProgress:0,burning:false,rotation:time*0.002,sparks:[],shots:[],shotCount:0,maxShots:8,sparklePhase:0};if(type==='RomanCandle')p.y=100;if(type==='SparklerBundle')p.y=240;
(old?original:bonfire)['draw'+type](ctx,p,time)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
