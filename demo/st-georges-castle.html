<!doctype html>
<html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>St George's Day castle</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121c24;color:#eee6d4;font:16px/1.6 system-ui}main{max-width:1000px;margin:auto;padding:40px 24px}h1{font:500 40px Georgia,serif;margin:0}p{color:#b8c4c7}section{margin:24px 0}canvas{display:block;width:100%;border-radius:12px;background:#1e303d}.light{background:#f0ecdf}</style>
<main><h1>St George's Day</h1><p>A limestone keep, drum towers and a flag for England.</p><section><canvas id="dark" width="950" height="330" aria-label="Castle at three sizes on a dark background"></canvas></section><section><canvas id="light" class="light" width="950" height="330" aria-label="Castle at three sizes on a light background"></canvas></section><p id="status">Drawing castles...</p></main>
<script type="module">
import theme from '../src/themes/st-georges.js';
for(const id of ['dark','light']) {
 const ctx=document.getElementById(id).getContext('2d');
 for(const [x,size] of [[145,80],[420,100],[760,150]]) theme.drawCastle(ctx,{x,y:300,size,opacity:1});
}
document.getElementById('status').textContent='Castle redraw at 80, 100 and 150 pixels. Both backgrounds rendered successfully.';
</script></html>
